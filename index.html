    <!-- Browser Extension & Web3 Injection Collision Guard (prevents 'Cannot redefine property: ethereum') -->
    <script>
      (function() {
        try {
          // Pre-declare configurable ethereum property on window to absorb extension assignments
          var _eth = undefined;
          try {
            Object.defineProperty(window, 'ethereum', {
              get: function() { return _eth; },
              set: function(val) { _eth = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}

          // Catch and suppress uncaught errors from external browser extensions
          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            var filename = (event && event.filename) || '';
            if (
              (typeof msg === 'string' && (
                msg.indexOf('redefine property: ethereum') !== -1 ||
                msg.indexOf('ethereum') !== -1 ||
                msg.indexOf('ResizeObserver loop') !== -1
              )) ||
              (typeof filename === 'string' && (
                filename.indexOf('extension') !== -1 ||
                filename.indexOf('chrome-extension') !== -1 ||
                filename.indexOf('moz-extension') !== -1
              ))
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          }, true);

          // Catch and suppress unhandled promise rejections from extensions
          window.addEventListener('unhandledrejection', function(event) {
            var reasonMsg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
            if (typeof reasonMsg === 'string' && (
              reasonMsg.indexOf('redefine property: ethereum') !== -1 ||
              reasonMsg.indexOf('ethereum') !== -1
            )) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>

    <!-- Theme Initialization (prevents flash of wrong theme, defaults to device system preference) -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('eev_theme');
          var isDark = storedTheme === 'dark' || (storedTheme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          var darkLogo = "https://res.cloudinary.com/doujptiz/image/upload/v1785988903/file_0000000090208246b8ee84f3f9f2bfe2_hxbnbi.png";
          var lightLogo = "https://res.cloudinary.com/doujptiz/image/upload/v1785982713/1785982475017_efn0fp.png";
          var logoUrl = isDark ? darkLogo : lightLogo;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
          var fav = document.getElementById('brand-favicon') || document.querySelector('link[rel="icon"]');
          if (fav) fav.href = logoUrl;
          var appleFav = document.getElementById('brand-apple-icon') || document.querySelector('link[rel="apple-touch-icon"]');
          if (appleFav) appleFav.href = logoUrl;
        } catch (e) {}
      })();
    </script>
